spring.main.web-application-type=none

# Path to the compiled Go ch-ui binary this wrapper launches and supervises.
chui.binaryPath=../ch-ui
chui.port=3488
chui.pidFile=ch-ui-server.pid
chui.stopTimeoutSeconds=15

# Passed through to the ch-ui binary as --clickhouse-url / --connection-name.
clickhouse.url=http://localhost:8123
clickhouse.connectionName=Local ClickHouse